<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="545" viewBox="0 0 1120 545" role="img"><style>.title{font:700 30px Arial,sans-serif;fill:#161616}.sub{font:400 16px Arial,sans-serif;fill:#666}.boxTitle{font:700 18px Arial,sans-serif;fill:#161616}.boxText{font:400 14px Arial,sans-serif;fill:#4c4c4c}.small{font:600 12px Arial,sans-serif;fill:#52606d;letter-spacing:.5px}.arrow{stroke:#77808a;stroke-width:2.2;fill:none;marker-end:url(#arrow)} </style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77808a"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="50" y="55" class="title">AI Engineering Control Loop</text><text x="50" y="83" class="sub">The agent advances only when state is observable and the result can be verified.</text><rect x="35" y="145" rx="12" width="190" height="135" fill="#f4f7fa" stroke="#49647c" stroke-width="1.5"/><text x="53" y="176" class="boxTitle">OBSERVE</text><text x="53" y="202" class="boxText">Instrument + GPS state</text><text x="53" y="223" class="boxText">Capture + compact RF summary</text><path d="M225 245 L252 245" class="arrow"/><rect x="252" y="145" rx="12" width="190" height="135" fill="#f4f7fa" stroke="#49647c" stroke-width="1.5"/><text x="270" y="176" class="boxTitle">DECIDE</text><text x="270" y="202" class="boxText">Continue, investigate,</text><text x="270" y="223" class="boxText">act, or hand back</text><path d="M442 245 L469 245" class="arrow"/><rect x="469" y="145" rx="12" width="190" height="135" fill="#fff" stroke="#cbd2d8" stroke-width="1.5"/><text x="487" y="176" class="boxTitle">ACT</text><text x="487" y="202" class="boxText">Approved semantic</text><text x="487" y="223" class="boxText">engineering tools only</text><path d="M659 245 L686 245" class="arrow"/><rect x="686" y="145" rx="12" width="190" height="135" fill="#f4f7fa" stroke="#49647c" stroke-width="1.5"/><text x="704" y="176" class="boxTitle">VERIFY</text><text x="704" y="202" class="boxText">Confirm the real system</text><text x="704" y="223" class="boxText">changed as intended</text><path d="M876 245 L903 245" class="arrow"/><rect x="903" y="145" rx="12" width="190" height="135" fill="#fff" stroke="#cbd2d8" stroke-width="1.5"/><text x="921" y="176" class="boxTitle">RECOVER</text><text x="921" y="202" class="boxText">Bounded retry / restore</text><text x="921" y="223" class="boxText">resume logic</text><path d="M900 280 C900 350 130 350 130 280" class="arrow"/><rect x="350" y="395" rx="12" width="420" height="110" fill="#f4f7fa" stroke="#49647c" stroke-width="1.5"/><text x="368" y="426" class="boxTitle">CONTINUE OR HAND BACK</text><text x="368" y="452" class="boxText">Healthy state: continue mission</text><text x="368" y="473" class="boxText">Unrecoverable / consequential state: return control</text><path d="M560 280 L560 395" class="arrow"/></svg>