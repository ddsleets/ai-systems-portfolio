<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img">
  <style>
    .title { font: 700 30px Arial, sans-serif; fill:#161616; }
    .sub { font: 400 16px Arial, sans-serif; fill:#666; }
    .boxTitle { font: 700 18px Arial, sans-serif; fill:#161616; }
    .boxText { font: 400 14px Arial, sans-serif; fill:#4c4c4c; }
    .small { font: 600 12px Arial, sans-serif; fill:#52606d; letter-spacing:.5px; }
    .arrow { stroke:#77808a; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
    .thin { stroke:#c9ced3; stroke-width:1.2; fill:none; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77808a"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
<text x="50" y="55" class="title">Supervised Agentic RF Measurement Architecture</text>
<text x="50" y="83" class="sub">Fast deterministic acquisition below; slower event-driven AI supervision above.</text>
<rect x="60" y="120" rx="12" width="270" height="125" fill="#f4f7fa" stroke="#49647c" stroke-width="1.5"/>
<text x="78" y="151" class="boxTitle">Human Engineer</text>
<text x="78" y="176" class="boxText">Sets mission and authority</text>
<text x="78" y="197" class="boxText">Monitors spectrum</text>
<text x="78" y="218" class="boxText">Nudges or takes over anytime</text><rect x="390" y="120" rx="12" width="290" height="125" fill="#f4f7fa" stroke="#49647c" stroke-width="1.5"/>
<text x="408" y="151" class="boxTitle">AI RF Engineer</text>
<text x="408" y="176" class="boxText">Observes system + RF summary</text>
<text x="408" y="197" class="boxText">Reasons about anomalies</text>
<text x="408" y="218" class="boxText">Chooses approved semantic tools</text><rect x="750" y="120" rx="12" width="285" height="125" fill="#ffffff" stroke="#cbd2d8" stroke-width="1.5"/>
<text x="768" y="151" class="boxTitle">Authority Governor</text>
<text x="768" y="176" class="boxText">Enforces autonomy mode</text>
<text x="768" y="197" class="boxText">Bounds tuning + recovery</text>
<text x="768" y="218" class="boxText">Blocks out-of-policy actions</text><path d="M330 182 L390 182" class="arrow"/><path d="M680 182 L750 182" class="arrow"/><rect x="390" y="300" rx="12" width="290" height="135" fill="#ffffff" stroke="#cbd2d8" stroke-width="1.5"/>
<text x="408" y="331" class="boxTitle">Python RF Control Plane</text>
<text x="408" y="356" class="boxText">Visible GUI + state</text>
<text x="408" y="377" class="boxText">PyVISA / SCPI adapter</text>
<text x="408" y="398" class="boxText">Capture, GPS, logs, post-process</text><rect x="60" y="300" rx="12" width="270" height="135" fill="#ffffff" stroke="#cbd2d8" stroke-width="1.5"/>
<text x="78" y="331" class="boxTitle">Local Event Detector</text>
<text x="78" y="356" class="boxText">Connectivity / stale capture</text>
<text x="78" y="377" class="boxText">GPS / carrier position</text>
<text x="78" y="398" class="boxText">RF variation / mission timer</text><rect x="750" y="300" rx="12" width="285" height="135" fill="#ffffff" stroke="#cbd2d8" stroke-width="1.5"/>
<text x="768" y="331" class="boxTitle">Keysight FieldFox</text>
<text x="768" y="356" class="boxText">SA / RTSA measurement</text>
<text x="768" y="377" class="boxText">Live spectrum acquisition</text>
