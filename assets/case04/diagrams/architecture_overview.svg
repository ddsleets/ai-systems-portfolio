<text x="408" y="521" class="boxTitle">Engineering Outputs</text>
<text x="408" y="546" class="boxText">UTC/GPS-aligned CSV</text>
<text x="408" y="567" class="boxText">RF post-processing plots</text>
<text x="408" y="588" class="boxText">KMZ / geospatial products</text><path d="M535 435 L535 490" class="arrow"/><text x="60" y="650" class="small">PUBLIC VIEW: implementation details, raw SCPI, prompts, thresholds, coordinates, and source code withheld.</text>
