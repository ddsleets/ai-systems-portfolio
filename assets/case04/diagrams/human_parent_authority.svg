<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img">
  <style>
    .title { font: 700 30px Arial, sans-serif; fill:#161616; }
    .sub { font: 400 16px Arial, sans-serif; fill:#666; }
    .boxTitle { font: 700 18px Arial, sans-serif; fill:#161616; }
    .boxText { font: 400 14px Arial, sans-serif; fill:#4c4c4c; }
    .small { font: 600 12px Arial, sans-serif; fill:#52606d; letter-spacing:.5px; }
    .arrow { stroke:#77808a; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
    .thin { stroke:#c9ced3; stroke-width:1.2; fill:none; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77808a"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
<text x="50" y="55" class="title">Human Parent + Bounded Autonomy</text>
<text x="50" y="83" class="sub">The engineer can supervise quietly, nudge the agent, change the GUI directly, or take control.</text>
<rect x="60" y="135" rx="12" width="300" height="140" fill="#ffffff" stroke="#cbd2d8" stroke-width="1.5"/>
<text x="78" y="166" class="boxTitle">MONITOR ONLY</text>
<text x="78" y="191" class="boxText">AI analyzes and explains</text>
<text x="78" y="212" class="boxText">No autonomous system changes</text><rect x="400" y="135" rx="12" width="300" height="140" fill="#f4f7fa" stroke="#49647c" stroke-width="1.5"/>
<text x="418" y="166" class="boxTitle">MISSION AUTONOMOUS</text>
<text x="418" y="191" class="boxText">Runs approved measurement mission</text>
<text x="418" y="212" class="boxText">Monitors + performs bounded recovery</text><rect x="740" y="135" rx="12" width="300" height="140" fill="#ffffff" stroke="#cbd2d8" stroke-width="1.5"/>
<text x="758" y="166" class="boxTitle">ADAPTIVE RF</text>
<text x="758" y="191" class="boxText">May retune approved parameters</text>
<text x="758" y="212" class="boxText">Only inside engineer-defined envelopes</text><path d="M360 205 L400 205" class="arrow"/><path d="M700 205 L740 205" class="arrow"/><rect x="185" y="350" rx="12" width="330" height="150" fill="#ffffff" stroke="#cbd2d8" stroke-width="1.5"/>
<text x="203" y="381" class="boxTitle">AI Engineer</text>
<text x="203" y="406" class="boxText">Operates workflow</text>
<text x="203" y="427" class="boxText">Watches RF + health events</text>
<text x="203" y="448" class="boxText">Explains why it acts or does not act</text><rect x="600" y="350" rx="12" width="330" height="150" fill="#f4f7fa" stroke="#49647c" stroke-width="1.5"/>
<text x="618" y="381" class="boxTitle">Human Engineer</text>
<text x="618" y="406" class="boxText">Analyzes spectrum</text>
<text x="618" y="427" class="boxText">Sends natural-language nudges</text>
<text x="618" y="448" class="boxText">Can pause, override, or take over</text><path d="M515 405 C555 370 565 370 600 405" class="arrow"/><path d="M600 455 C555 490 555 490 515 455" class="arrow"/><text x="518" y="382" class="small">NUDGE</text><text x="515" y="500" class="small">VISIBLE STATE</text>
</svg>