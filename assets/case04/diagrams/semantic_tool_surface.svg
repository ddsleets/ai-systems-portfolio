<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="500" viewBox="0 0 1110 500" role="img">
  <style>
    .title { font: 700 30px Arial, sans-serif; fill:#161616; }
    .sub { font: 400 16px Arial, sans-serif; fill:#666; }
    .boxTitle { font: 700 18px Arial, sans-serif; fill:#161616; }
    .boxText { font: 400 14px Arial, sans-serif; fill:#4c4c4c; }
    .small { font: 600 12px Arial, sans-serif; fill:#52606d; letter-spacing:.5px; }
    .arrow { stroke:#77808a; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
    .thin { stroke:#c9ced3; stroke-width:1.2; fill:none; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77808a"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  
<text x="50" y="55" class="title">Approved AI Engineering Tool Surface</text>
<text x="50" y="83" class="sub">The model does not receive an arbitrary code or raw-SCPI tool.</text>
<rect x="55" y="135" rx="12" width="235" height="260" fill="#f4f7fa" stroke="#49647c" stroke-width="1.5"/>
<text x="73" y="166" class="boxTitle">OBSERVE</text>
<text x="73" y="191" class="boxText">observe_system()</text>
<text x="73" y="212" class="boxText">validate_capture()</text><rect x="315" y="135" rx="12" width="235" height="260" fill="#f4f7fa" stroke="#49647c" stroke-width="1.5"/>
<text x="333" y="166" class="boxTitle">MISSION</text>
<text x="333" y="191" class="boxText">connect_instrument()</text>
<text x="333" y="212" class="boxText">configure_mission()</text>
<text x="333" y="233" class="boxText">enable_gps()</text>
<text x="333" y="254" class="boxText">start_capture()</text>
<text x="333" y="275" class="boxText">stop_capture()</text><rect x="575" y="135" rx="12" width="235" height="260" fill="#ffffff" stroke="#cbd2d8" stroke-width="1.5"/>
<text x="593" y="166" class="boxTitle">ADAPT</text>
<text x="593" y="191" class="boxText">tune_measurement()</text>
<text x="593" y="212" class="boxText">recenter_on_peak()</text>
<text x="593" y="233" class="boxText">set_auto_reflevel()</text><rect x="835" y="135" rx="12" width="235" height="260" fill="#ffffff" stroke="#cbd2d8" stroke-width="1.5"/>
<text x="853" y="166" class="boxTitle">RECOVER + CLOSE</text>
<text x="853" y="191" class="boxText">recover_acquisition()</text>
<text x="853" y="212" class="boxText">generate_kmz()</text>
<text x="853" y="233" class="boxText">record_engineering_note()</text>
<text x="853" y="254" class="boxText">complete_mission()</text>
<text x="853" y="275" class="boxText">handoff_to_human()</text><text x="55" y="445" class="small">Names shown publicly; schemas, prompt instructions, thresholds, and implementations remain private.</text>
</svg>