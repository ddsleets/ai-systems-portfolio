<text x="54" y="230" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:500;fill:#344052;">Raw known accuracy</text><text x="355" y="230" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#2556d8;">81.0%</text>
<line x1="50" y1="330" x2="360" y2="330" stroke="#d7deea" stroke-width="1"/><text x="54" y="292" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:500;fill:#344052;">Known acceptance rate</text><text x="355" y="292" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#2556d8;">60.0%</text>
<line x1="50" y1="392" x2="360" y2="392" stroke="#d7deea" stroke-width="1"/><text x="54" y="354" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:500;fill:#344052;">Accepted-known accuracy</text><text x="355" y="354" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#2556d8;">89.2%</text>
<line x1="50" y1="454" x2="360" y2="454" stroke="#d7deea" stroke-width="1"/><text x="54" y="416" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:500;fill:#344052;">Fresh unknown rejection</text><text x="355" y="416" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#2556d8;">47.0%</text>
<line x1="50" y1="516" x2="360" y2="516" stroke="#d7deea" stroke-width="1"/><text x="54" y="478" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:500;fill:#344052;">Open-set accuracy</text><text x="355" y="478" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#2556d8;">51.3%</text>
<line x1="50" y1="578" x2="360" y2="578" stroke="#d7deea" stroke-width="1"/><text x="54" y="540" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:500;fill:#344052;">Balanced open-set</text><text x="355" y="540" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#2556d8;">50.2%</text>
<rect x="410" y="125" width="350" height="500" rx="18" fill="#fbfcfe" stroke="#3269a8" stroke-width="2"/><rect x="410" y="125" width="350" height="75" rx="18" fill="#3269a8"/><rect x="410" y="182" width="350" height="18" fill="#3269a8"/><circle cx="455" cy="163" r="25" fill="white"/><text x="455" y="171" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:800;fill:#3269a8;">2</text><text x="492" y="169" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:800;fill:#ffffff;">Hierarchical Audit (M3G)</text>
