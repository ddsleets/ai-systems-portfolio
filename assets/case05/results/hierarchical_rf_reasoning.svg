<line x1="430" y1="330" x2="740" y2="330" stroke="#d7deea" stroke-width="1"/><text x="434" y="292" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:500;fill:#344052;">RF-family accuracy</text><text x="735" y="292" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#2556d8;">92.5%</text>
<line x1="430" y1="392" x2="740" y2="392" stroke="#d7deea" stroke-width="1"/><text x="434" y="354" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:500;fill:#344052;">Strict UNKNOWN rejection</text><text x="735" y="354" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#2556d8;">47.0%</text>
<line x1="430" y1="454" x2="740" y2="454" stroke="#d7deea" stroke-width="1"/><text x="434" y="416" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:500;fill:#344052;">Same-family unseen</text><text x="735" y="416" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#2556d8;">88.7%</text>
<line x1="430" y1="516" x2="740" y2="516" stroke="#d7deea" stroke-width="1"/><text x="434" y="478" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:500;fill:#344052;">Novel-family rejection</text><text x="735" y="478" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#2556d8;">30.0%</text>
<line x1="430" y1="578" x2="740" y2="578" stroke="#d7deea" stroke-width="1"/><text x="434" y="540" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:500;fill:#344052;">Hierarchical score</text><text x="735" y="540" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#2556d8;">87.3%</text>
<rect x="790" y="125" width="350" height="500" rx="18" fill="#fbfcfe" stroke="#1786c8" stroke-width="2"/><rect x="790" y="125" width="350" height="75" rx="18" fill="#1786c8"/><rect x="790" y="182" width="350" height="18" fill="#1786c8"/><circle cx="835" cy="163" r="25" fill="white"/><text x="835" y="171" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:800;fill:#1786c8;">3</text><text x="872" y="169" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:800;fill:#ffffff;">Family-Level Open-Set (M3H)</text>
<line x1="810" y1="268" x2="1120" y2="268" stroke="#d7deea" stroke-width="1"/><text x="814" y="230" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:500;fill:#344052;">Validation family accuracy</text><text x="1115" y="230" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#2556d8;">84.0%</text>
<line x1="810" y1="330" x2="1120" y2="330" stroke="#d7deea" stroke-width="1"/><text x="814" y="292" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:500;fill:#344052;">External raw family accuracy</text><text x="1115" y="292" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#2556d8;">91.0%</text>
<line x1="810" y1="392" x2="1120" y2="392" stroke="#d7deea" stroke-width="1"/><text x="814" y="354" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:500;fill:#344052;">Accepted-family accuracy</text><text x="1115" y="354" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#2556d8;">99.3%</text>
<line x1="810" y1="454" x2="1120" y2="454" stroke="#d7deea" stroke-width="1"/><text x="814" y="416" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:500;fill:#344052;">Novel-family rejection</text><text x="1115" y="416" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#2556d8;">66.7%</text>
<line x1="810" y1="516" x2="1120" y2="516" stroke="#d7deea" stroke-width="1"/><text x="814" y="478" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:500;fill:#344052;">Balanced hierarchical</text><text x="1115" y="478" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#2556d8;">67.2%</text>
<rect x="30" y="655" width="1110" height="80" rx="18" fill="#eef3ff" stroke="#2556d8" stroke-width="2"/><text x="60" y="704" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:800;fill:#0d2f6f;">Key story:</text><text x="185" y="704" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:600;fill:#0d1624;">family-level reasoning is much stronger than strict novel-class rejection.</text>
