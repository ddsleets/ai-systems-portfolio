<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Open-set and hierarchical RF reasoning</title>
<desc id="desc">Three-panel dashboard showing exact-class, hierarchical taxonomy, and family-level open-set performance.</desc>
<rect x="0" y="0" width="1200" height="760" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="40" y="54" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:800;fill:#0d2f6f;">Case 05 — Open-Set and Hierarchical RF Reasoning</text>
<text x="40" y="88" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:400;fill:#6c7685;font-style:italic;">Operational performance beyond exact-class accuracy</text>
<rect x="30" y="125" width="350" height="500" rx="18" fill="#fbfcfe" stroke="#0d2f6f" stroke-width="2"/>
<rect x="30" y="125" width="350" height="75" rx="18" fill="#0d2f6f"/>
