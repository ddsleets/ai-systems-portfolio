<line x1="70" y1="580" x2="830" y2="580" stroke="#0d1624" stroke-width="2"/>
<text x="25" y="385" transform="rotate(-90 25 385)" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#0d1624;">Accuracy (%)</text>
<rect x="109.16666666666666" y="425.86" width="105" height="154.14000000000001" rx="8" fill="#8fbaf5"/>
