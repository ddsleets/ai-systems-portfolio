<text x="40" y="90" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:400;fill:#6c7685;font-style:italic;">TorchSig 2.1.1 synthetic RF benchmark, 10 classes</text>
<line x1="40" y1="112" x2="1160" y2="112" stroke="#2556d8" stroke-width="3"/>
<line x1="70" y1="580.0" x2="830" y2="580.0" stroke="#cfd6e2" stroke-width="1" stroke-dasharray="5 6"/>
