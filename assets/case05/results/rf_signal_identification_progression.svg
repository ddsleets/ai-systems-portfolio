<line x1="70" y1="328.0" x2="830" y2="328.0" stroke="#cfd6e2" stroke-width="1" stroke-dasharray="5 6"/>
<text x="55" y="334.0" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;fill:#344052;">60</text>
<line x1="70" y1="244.0" x2="830" y2="244.0" stroke="#cfd6e2" stroke-width="1" stroke-dasharray="5 6"/>
