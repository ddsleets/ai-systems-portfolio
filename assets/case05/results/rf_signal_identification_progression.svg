<text x="161.66666666666666" y="612" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:800;fill:#0d1624;">M2B</text>
<text x="161.66666666666666" y="636" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;fill:#344052;"><tspan x="161.66666666666666" dy="0">Baseline engineered</tspan><tspan x="161.66666666666666" dy="16">features</tspan></text>
<rect x="253.33333333333331" y="277.6" width="105" height="302.4" rx="8" fill="#6aa3ef"/>
<text x="305.8333333333333" y="265.6" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#0d2f6f;">72.0%</text>
<text x="305.8333333333333" y="612" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:800;fill:#0d1624;">M2D</text>
<text x="305.8333333333333" y="636" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;fill:#344052;"><tspan x="305.8333333333333" dy="0">Enhanced engineered</tspan><tspan x="305.8333333333333" dy="16">features</tspan></text>
