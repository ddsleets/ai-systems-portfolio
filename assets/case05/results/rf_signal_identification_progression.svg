<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">RF signal identification performance progression</title>
<desc id="desc">Bar chart showing model accuracy improving from 36.7 percent baseline to 81 percent external confirmation.</desc>
