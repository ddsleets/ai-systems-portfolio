<text x="450.0" y="612" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:800;fill:#0d1624;">M3A</text>
<text x="450.0" y="636" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;fill:#344052;"><tspan x="450.0" dy="0">Direct I/Q CNN</tspan></text>
<rect x="541.6666666666666" y="265.0" width="105" height="315.0" rx="8" fill="#2f6ed4"/>
<text x="594.1666666666666" y="253.0" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#0d2f6f;">75.0%</text>
<text x="594.1666666666666" y="612" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:800;fill:#0d1624;">M3B</text>
<text x="594.1666666666666" y="636" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;fill:#344052;"><tspan x="594.1666666666666" dy="0">Eng + I/Q fusion</tspan></text>
<rect x="685.8333333333333" y="239.79999999999995" width="105" height="340.20000000000005" rx="8" fill="#0d2f6f"/>
<text x="738.3333333333333" y="227.79999999999995" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#0d2f6f;">81.0%</text>
<text x="738.3333333333333" y="612" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:800;fill:#0d1624;">M3E</text>
<text x="738.3333333333333" y="636" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;fill:#344052;"><tspan x="738.3333333333333" dy="0">External confirmation</tspan></text>
<rect x="875" y="165" width="285" height="185" rx="22" fill="#eef3ff" stroke="#2556d8" stroke-width="3"/>
<text x="1017" y="220" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:52px;font-weight:800;fill:#2556d8;">+44.3</text>
<text x="1017" y="257" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:800;fill:#2556d8;">percentage points</text>
<text x="1017" y="288" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:500;fill:#344052;">vs. baseline</text>
<rect x="875" y="380" width="285" height="170" rx="22" fill="#f7f9fc" stroke="#0d2f6f" stroke-width="3"/>
<text x="1017" y="428" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:800;fill:#0d2f6f;">CONFIRMED WINNER</text>
<line x1="920" y1="450" x2="1114" y2="450" stroke="#0d2f6f" stroke-width="2"/>
<text x="1017" y="500" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:800;fill:#0d2f6f;">Eng+IQ-235</text>
<text x="1017" y="532" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:600;fill:#344052;">81% external accuracy</text>
<line x1="40" y1="655" x2="1160" y2="655" stroke="#b8c2d0" stroke-width="1"/>
<text x="52" y="681" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;fill:#6c7685;"><tspan x="52" dy="0">Candidate-model evaluation on held-out/external synthetic data;</tspan><tspan x="52" dy="16">no predictions were promoted to ground truth.</tspan></text>
