<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Cross-day transmitter fingerprinting diagnostic</title>
<desc id="desc">WiSig day-holdout analysis showing 45 percent seen-day holdout accuracy but much lower later-day performance.</desc>
<rect x="0" y="0" width="1200" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="40" y="55" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:800;fill:#0d2f6f;">Case 05 — Cross-Day Transmitter Fingerprinting Diagnostic</text>
<text x="40" y="88" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:400;fill:#2556d8;font-style:italic;">WiSig ManyTx day-holdout analysis</text>
<rect x="35" y="125" width="770" height="520" rx="18" fill="#fbfcfe" stroke="#d8dfe9" stroke-width="2"/>
<text x="420" y="170" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:800;fill:#0d2f6f;">Identification Accuracy (%)</text>
<line x1="90" y1="515" x2="750" y2="515" stroke="#cfd6e2" stroke-width="1" stroke-dasharray="5 6"/><text x="78" y="521" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#344052;">0</text>
<line x1="90" y1="463.333" x2="750" y2="463.333" stroke="#cfd6e2" stroke-width="1" stroke-dasharray="5 6"/><text x="78" y="469.333" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#344052;">10</text>
<line x1="90" y1="411.667" x2="750" y2="411.667" stroke="#cfd6e2" stroke-width="1" stroke-dasharray="5 6"/><text x="78" y="417.667" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#344052;">20</text>
<line x1="90" y1="360" x2="750" y2="360" stroke="#cfd6e2" stroke-width="1" stroke-dasharray="5 6"/><text x="78" y="366" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#344052;">30</text>
<line x1="90" y1="308.333" x2="750" y2="308.333" stroke="#cfd6e2" stroke-width="1" stroke-dasharray="5 6"/><text x="78" y="314.333" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#344052;">40</text>
<line x1="90" y1="256.667" x2="750" y2="256.667" stroke="#cfd6e2" stroke-width="1" stroke-dasharray="5 6"/><text x="78" y="262.667" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#344052;">50</text>
<line x1="90" y1="205" x2="750" y2="205" stroke="#cfd6e2" stroke-width="1" stroke-dasharray="5 6"/><text x="78" y="211" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;fill:#344052;">60</text>
<line x1="90" y1="205" x2="90" y2="515" stroke="#0d1624" stroke-width="2"/><line x1="90" y1="515" x2="750" y2="515" stroke="#0d1624" stroke-width="2"/>
<rect x="133.333" y="463.333" width="80" height="51.667" rx="6" fill="#9aa7b7"/><text x="173.333" y="453.333" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:800;fill:#0d1624;">10.0%</text><text x="173.333" y="545" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:600;fill:#344052;"><tspan x="173.333" dy="0">Random</tspan><tspan x="173.333" dy="16">chance</tspan></text>
<rect x="256.667" y="282.5" width="80" height="232.5" rx="6" fill="#2556d8"/><text x="296.667" y="272.5" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:800;fill:#0d1624;">45.0%</text><text x="296.667" y="545" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:600;fill:#344052;"><tspan x="296.667" dy="0">Seen-day</tspan><tspan x="296.667" dy="16">holdout</tspan></text>
<rect x="380" y="417.867" width="80" height="97.133" rx="6" fill="#8fbaf5"/><text x="420" y="407.867" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:800;fill:#0d1624;">18.8%</text><text x="420" y="545" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:600;fill:#344052;"><tspan x="420" dy="0">Day 3</tspan><tspan x="420" dy="16">external</tspan></text>
<rect x="503.333" y="432.333" width="80" height="82.667" rx="6" fill="#a8c8f7"/><text x="543.333" y="422.333" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:800;fill:#0d1624;">16.0%</text><text x="543.333" y="545" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:600;fill:#344052;"><tspan x="543.333" dy="0">Day 4</tspan><tspan x="543.333" dy="16">external</tspan></text>
<rect x="626.667" y="401.333" width="80" height="113.667" rx="6" fill="#c1c8d2"/><text x="666.667" y="391.333" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:800;fill:#0d1624;">22.0%</text><text x="666.667" y="545" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:600;fill:#344052;"><tspan x="666.667" dy="0">Original M4A</tspan><tspan x="666.667" dy="16">Day-4 test</tspan></text>
<rect x="70" y="575" width="700" height="50" rx="12" fill="#f8fafc" stroke="#d8dfe9" stroke-width="1"/><text x="90" y="607" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:600;fill:#344052;">Seen-day learning is clear; cross-day domain drift is the dominant bottleneck.</text>
<rect x="835" y="125" width="330" height="310" rx="18" fill="#fbfcfe" stroke="#d8dfe9" stroke-width="2"/><text x="860" y="165" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:800;fill:#0d2f6f;">Benchmark context</text>
<text x="860" y="205" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#6c7685;">Receiver</text><text x="1135" y="205" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#0d1624;">18-2</text>
<text x="860" y="245" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#6c7685;">Transmitters</text><text x="1135" y="245" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#0d1624;">10</text>
<text x="860" y="285" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#6c7685;">Signals / Tx / day</text><text x="1135" y="285" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#0d1624;">40</text>
<text x="860" y="325" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#6c7685;">Training days</text><text x="1135" y="325" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#0d1624;">Mar 01 + Mar 08</text>
<text x="860" y="365" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#6c7685;">Validation day</text><text x="1135" y="365" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#0d1624;">Mar 15</text>
<text x="860" y="405" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#6c7685;">Untouched test day</text><text x="1135" y="405" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#0d1624;">Mar 23</text>
<rect x="835" y="465" width="330" height="115" rx="18" fill="#eef3ff" stroke="#2556d8" stroke-width="2"/><text x="860" y="500" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:800;fill:#0d2f6f;">Conclusion: mixed limitation</text><text x="860" y="532" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:500;fill:#344052;"><tspan x="860" dy="0">Transmitter-specific structure is learnable,</tspan><tspan x="860" dy="20">but it does not remain stable across days.</tspan></text>
<rect x="835" y="600" width="330" height="70" rx="14" fill="#fff6e6" stroke="#e0a12d" stroke-width="1"/><text x="855" y="628" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:500;fill:#344052;"><tspan x="855" dy="0">Candidate benchmark only; does not establish</tspan><tspan x="855" dy="16">receiver-agnostic fingerprinting.</tspan></text>
</svg>